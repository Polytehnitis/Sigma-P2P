# whisper.cpp (sigma-voice) reads GGML_* variables as CMake options.
#
# Build for any x86-64 CPU from the last decade (AVX2, FMA, F16C) instead of only the CPU
# that compiles it: a build made on a PC with AVX-512 must not crash on one without. ARM
# builds ignore the x86 options and use the compiler's default CPU for the target.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"

# On Windows the cmake crate replaces CMake's Release flags (and with them /O2) by the C
# compiler flags of the build script, which carry no optimization: whisper.cpp then ran
# ~20x slower than on Linux. These flags reach those variables through the cc crate, and
# only for MSVC targets.
CFLAGS_x86_64_pc_windows_msvc = "-O2 -Ob2 -DNDEBUG"
CXXFLAGS_x86_64_pc_windows_msvc = "-O2 -Ob2 -DNDEBUG"
CFLAGS_aarch64_pc_windows_msvc = "-O2 -Ob2 -DNDEBUG"
CXXFLAGS_aarch64_pc_windows_msvc = "-O2 -Ob2 -DNDEBUG"
