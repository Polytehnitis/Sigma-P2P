[package]
name = "sigma-desktop"
description = "Keyboard, mouse and screen perception for Sigma on the user's desktop (opt-in)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
sigma-core.workspace = true

# The real keyboard, mouse and screen. Without it (and on mobile) only the test devices exist.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
enigo = { version = "0.6", optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap = { version = "0.9", optional = true }

# Linux: X11 screen capture without system libraries (x11rb is pure Rust; enigo uses it too).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", optional = true }

[features]
default = ["native"]
native = ["dep:enigo", "dep:xcap", "dep:x11rb"]
