name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.50.1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  public-relay:
    name: P2P over n0 public relays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sigma-net --test public_relay -- --ignored --nocapture

  flutter:
    name: Flutter ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: android, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
          - { target: ios, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: flutter-${{ matrix.target }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - if: matrix.target == 'linux'
        run: flutter analyze
      - if: matrix.target == 'linux'
        run: flutter test
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev ninja-build xvfb
          flutter build linux --debug
          xvfb-run -a flutter test integration_test/agent_test.dart -d linux
          xvfb-run -a flutter test integration_test/avatar_test.dart -d linux
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.target == 'android'
        run: flutter build apk --debug
      - if: matrix.target == 'windows'
        run: flutter build windows --debug
      - if: matrix.target == 'macos'
        run: flutter build macos --debug
      - if: matrix.target == 'ios'
        run: flutter build ios --debug --no-codesign
