name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.50.1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # sigma-desktop's keyboard (enigo) links libxkbcommon on Linux.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  gpu:
    name: GPU backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: gpu
      # Linux runners have no GPU: Mesa's lavapipe is a software Vulkan device, so the shader
      # really runs there and the test requires it.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          echo "SIGMA_REQUIRE_GPU=1" >> "$GITHUB_ENV"
      - run: cargo clippy -p sigma-core --features gpu --all-targets -- -D warnings
      - run: cargo test -p sigma-core --features gpu --lib tests_gpu -- --nocapture

  # Real speech through whisper.cpp (Whisper and Parakeet), on every desktop OS: a known
  # recording, and on Linux a synthesized "stop" (the word that halts desktop control).
  speech:
    name: Speech, whisper.cpp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: speech
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/speech-models
          key: speech-models-tiny.en-parakeet-v3-q8_0
      - name: Fetch the models and a recording
        shell: bash
        run: |
          models="$RUNNER_TEMP/speech-models"
          mkdir -p "$models" "$RUNNER_TEMP/speech"
          fetch() { # file url sha256
            [ -f "$models/$1" ] || curl -sSfL --retry 3 -o "$models/$1" "$2"
            sum=$( (sha256sum "$models/$1" 2>/dev/null || shasum -a 256 "$models/$1") | cut -d' ' -f1)
            test "$sum" = "$3" || { echo "$1: checksum $sum"; rm -f "$models/$1"; exit 1; }
          }
          fetch ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin \
            921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f
          fetch ggml-parakeet-tdt-0.6b-v3-q8_0.bin \
            https://huggingface.co/ggml-org/parakeet-GGUF/resolve/main/ggml-parakeet-tdt-0.6b-v3-q8_0.bin \
            4d64e9e96c2792186d072fde0034df0ad670cf680a2f53069052ead827fd600e
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/speech/jfk.wav" \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.6/samples/jfk.wav
          echo "SIGMA_WHISPER_MODEL=$models/ggml-tiny.en.bin" >> "$GITHUB_ENV"
          echo "SIGMA_PARAKEET_MODEL=$models/ggml-parakeet-tdt-0.6b-v3-q8_0.bin" >> "$GITHUB_ENV"
          echo "SIGMA_WHISPER_WAV=$RUNNER_TEMP/speech/jfk.wav" >> "$GITHUB_ENV"
          echo "SIGMA_WHISPER_EXPECT=ask not what your country can do for you" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        name: Say "stop"
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          espeak-ng -s 140 -w "$RUNNER_TEMP/speech/stop.wav" "Stop."
          echo "SIGMA_WHISPER_WAV=$SIGMA_WHISPER_WAV;$RUNNER_TEMP/speech/stop.wav" >> "$GITHUB_ENV"
          echo "SIGMA_WHISPER_EXPECT=$SIGMA_WHISPER_EXPECT;stop" >> "$GITHUB_ENV"
      - run: cargo test -p sigma-voice --release -- --include-ignored --nocapture --test-threads=1
        env:
          SIGMA_WHISPER_BENCH: "1"
          # A ceiling for the 11 s recording, to catch a build that lost its optimizations.
          SIGMA_WHISPER_MAX_SECONDS: "8"

  public-relay:
    name: P2P over n0 public relays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sigma-net --test public_relay -- --ignored --nocapture

  flutter:
    name: Flutter ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: android, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
          - { target: ios, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: flutter-${{ matrix.target }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - if: matrix.target == 'linux'
        run: flutter analyze
      # Native assets of window_manager build even for `flutter test`.
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev libxkbcommon-dev ninja-build xvfb
      - if: matrix.target == 'linux'
        run: flutter test
      - if: matrix.target == 'linux'
        run: |
          flutter build linux --debug
          xvfb-run -a flutter test integration_test/agent_test.dart -d linux
          xvfb-run -a flutter test integration_test/avatar_test.dart -d linux
          xvfb-run -a flutter test integration_test/desktop_test.dart -d linux
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.target == 'android'
        run: flutter build apk --debug
      - if: matrix.target == 'windows'
        run: flutter build windows --debug
      - if: matrix.target == 'macos'
        run: flutter build macos --debug
      - if: matrix.target == 'ios'
        run: flutter build ios --debug --no-codesign
