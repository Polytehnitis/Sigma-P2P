name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.50.1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # sigma-desktop's keyboard (enigo) links libxkbcommon on Linux.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  gpu:
    name: GPU backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: gpu
      # Linux runners have no GPU: Mesa's lavapipe is a software Vulkan device, so the shader
      # really runs there and the test requires it.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          echo "SIGMA_REQUIRE_GPU=1" >> "$GITHUB_ENV"
      - run: cargo clippy -p sigma-core --features gpu --all-targets -- -D warnings
      - run: cargo test -p sigma-core --features gpu --lib tests_gpu -- --nocapture

  # Real speech through whisper.cpp, on every desktop OS: a known recording, and on Linux a
  # synthesized "stop" (the word that halts desktop control).
  whisper:
    name: whisper.cpp speech (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: whisper
      - name: Fetch a model and a recording
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/speech" && cd "$RUNNER_TEMP/speech"
          curl -sSfL --retry 3 -o ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          curl -sSfL --retry 3 -o jfk.wav \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.8.3/samples/jfk.wav
          sum=$( (sha256sum ggml-tiny.en.bin 2>/dev/null || shasum -a 256 ggml-tiny.en.bin) | cut -d' ' -f1)
          test "$sum" = 921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f
          echo "SIGMA_WHISPER_MODEL=$RUNNER_TEMP/speech/ggml-tiny.en.bin" >> "$GITHUB_ENV"
          echo "SIGMA_WHISPER_WAV=$RUNNER_TEMP/speech/jfk.wav" >> "$GITHUB_ENV"
          echo "SIGMA_WHISPER_EXPECT=ask not what your country can do for you" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        name: Say "stop"
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          espeak-ng -s 140 -w "$RUNNER_TEMP/speech/stop.wav" "Stop."
          echo "SIGMA_WHISPER_WAV=$SIGMA_WHISPER_WAV;$RUNNER_TEMP/speech/stop.wav" >> "$GITHUB_ENV"
          echo "SIGMA_WHISPER_EXPECT=$SIGMA_WHISPER_EXPECT;stop" >> "$GITHUB_ENV"
      - run: cargo test -p sigma-voice --release -- --include-ignored --nocapture

  public-relay:
    name: P2P over n0 public relays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sigma-net --test public_relay -- --ignored --nocapture

  flutter:
    name: Flutter ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: android, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
          - { target: ios, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: flutter-${{ matrix.target }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - if: matrix.target == 'linux'
        run: flutter analyze
      # Native assets of window_manager build even for `flutter test`.
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev libxkbcommon-dev ninja-build xvfb
      - if: matrix.target == 'linux'
        run: flutter test
      - if: matrix.target == 'linux'
        run: |
          flutter build linux --debug
          xvfb-run -a flutter test integration_test/agent_test.dart -d linux
          xvfb-run -a flutter test integration_test/avatar_test.dart -d linux
          xvfb-run -a flutter test integration_test/desktop_test.dart -d linux
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.target == 'android'
        run: flutter build apk --debug
      - if: matrix.target == 'windows'
        run: flutter build windows --debug
      - if: matrix.target == 'macos'
        run: flutter build macos --debug
      - if: matrix.target == 'ios'
        run: flutter build ios --debug --no-codesign
